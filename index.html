<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WORDLY DICTIONARY</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main Content -->
    <main>
      <!-- Main heading for the dictionary -->
      <h1>WORDLY DICTIONARY</h1>
      <form id="search-form">
        <!-- Input where one can type a word -->
        <input
          type="text"
          id="word-input"
          placeholder="Type a word..."
          aria-label="Search for a word"  
          required
        />
        <!-- Button for searching -->
        <button type="submit">Search</button>
      </form>
      <div id="content">
        <!-- Section for displaying search results -->
        <section id="results">
          <h2 id="word"></h2>
          <p id="pronunciation"></p>
          <div id="part-of-speech"></div>
          <div id="definition"></div>
          <p id="example"></p>
          <h3>Synonyms</h3>
          <ul id="synonyms"></ul>
          <audio id="audio" controls></audio>
          <p id="source"></p>
          <p id="error-message"></p>
        </section>
        <!-- Section to display search history -->
        <section id="history">
          <h2>Search History</h2>
          <ul id="history-list"></ul>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
